# 로컬 개발용 구성 — 포트는 127.0.0.1에만, 인증서는 내부 CA, 데이터는 data-v2.
# ⚠ 운영 서버에서 쓰지 않는다. 운영은 deploy/docker/compose.yml (그 폴더에서 docker compose).
#   프로젝트 이름을 naru-dev로 따로 둔다 — 운영(naru)과 같으면 서버에서 실수로 돌렸을 때 운영 컨테이너를 덮어쓴다 (2026-10-14 실제로 겪음).
#   이제는 같은 컨테이너 이름이 이미 있으면 만들지 못하고 멈춘다.
#   docker network create naru-net               ← 처음 한 번
#   docker compose up -d --build
#   docker compose logs naru | grep setup                  ← 첫 설정 주소
#   http://localhost:8088/setup?token=...                    ← 웹서버(Caddy)를 거쳐 들어간다
name: naru-dev

services:
  # 웹서버 엔진. 설정은 Naru가 관리 소켓으로 통째로 밀어넣는다 — 이 컨테이너에 설정 파일을 두지 않는다.
  caddy:
    image: caddy:2
    container_name: naru-caddy        # shelf- 로 시작하면 안 된다 (v1이 앱으로 오해한다)
    restart: unless-stopped
    command: caddy run --resume --config /etc/caddy/bootstrap.json
    ports:
      # 운영에서는 "80:80", "443:443", "443:443/udp"
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8443:443"
    volumes:
      - caddy-admin:/run/caddy                       # 관리 소켓 — Caddy와 Naru만
      - ./caddy/bootstrap.json:/etc/caddy/bootstrap.json:ro
      - ./data-v2/caddy/data:/data                   # 인증서
      - ./data-v2/caddy/config:/config               # 마지막 설정(autosave) — 재시작해도 이어서
      - ./data-v2/sites:/srv/sites:ro                # 정적 사이트 — Naru가 올리고 웹서버는 읽기만
    extra_hosts:
      - "host.docker.internal:host-gateway"          # "이 서버"에서 도는 것(NAS 등)에 닿는 길
    networks: [apps]

  naru:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naru
    restart: unless-stopped
    environment:
      - NARU_TLS=internal                            # 로컬: 공개 CA에 요청하지 않는다
      - NARU_HTTPS_PORT=8443                         # 로컬은 HTTPS를 8443으로 열었다 — HTTP에서 넘길 때 이 포트로
      - NARU_NETWORK=${NARU_NETWORK:-naru-net}       # 앱 컨테이너를 붙일 네트워크 (아래 apps와 같아야 한다)
    ports:
      - "127.0.0.1:8080:8080"                        # 웹서버를 거치지 않고 들어가는 뒷문 (로컬 전용)
    volumes:
      # v1 데이터의 "복사본"을 넣어 두면 첫 실행 때 계정·앱·프록시 호스트를 옮겨 온다
      - ./data-v2:/data
      - caddy-admin:/run/caddy
      - /var/run/docker.sock:/var/run/docker.sock    # 컨테이너 상태 — 관리자는 설계상 root와 같다
    extra_hosts:
      - "host.docker.internal:host-gateway"         # 웹서버와 같은 길로 "이 서버"의 포트를 확인한다 (진단)
    networks: [apps]

volumes:
  caddy-admin:

# 앱 컨테이너와 웹서버가 함께 있는 네트워크 — 미리 만들어 둔다 (운영 구성과 같은 방식)
networks:
  apps:
    name: ${NARU_NETWORK:-naru-net}
    external: true
